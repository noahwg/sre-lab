---
# `--tags migrate` runs image.yml + migrate.yml only; `--tags app` runs everything,
# applying migrations before the app is (re)started.
- name: Work out the image and log in to ECR
  ansible.builtin.import_tasks: image.yml
  tags: [migrate]

- name: Apply database migrations
  ansible.builtin.import_tasks: migrate.yml
  tags: [migrate]

- name: Read the API key from SSM Parameter Store
  ansible.builtin.set_fact:
    app_api_key: "{{ lookup('amazon.aws.ssm_parameter', app_api_key_parameter, region=ansible_aws_ssm_region, decrypt=true) }}"
  no_log: true

- name: Refuse to deploy a missing or placeholder API key
  ansible.builtin.assert:
    that:
      - app_api_key != app_api_key_placeholder
      - app_api_key | length >= app_api_key_min_length
    fail_msg: >-
      {{ app_api_key_parameter }} is still the placeholder or shorter than
      {{ app_api_key_min_length }} characters. Set a real value in Parameter Store.
    quiet: true
  no_log: true

- name: Read the database connection string
  ansible.builtin.set_fact:
    app_database_url: >-
      postgres://{{ app_db_app_user }}:{{ lookup('amazon.aws.ssm_parameter', app_db_app_password_parameter, region=ansible_aws_ssm_region, decrypt=true) }}@{{ app_db_host }}:5432/{{ app_db_name }}?sslmode=disable
  no_log: true

- name: Refuse to deploy with a placeholder database password
  ansible.builtin.assert:
    that:
      - "'REPLACE_ME' not in app_database_url"
    fail_msg: "{{ app_db_app_password_parameter }} is still the placeholder. Set a real value in Parameter Store."
    quiet: true
  no_log: true

- name: Create the app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the app environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/app.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: app_env

- name: Render the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start the app
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    remove_orphans: true
    # env_file changes don't alter the compose file, so force a recreate when it changed.
    recreate: "{{ 'always' if app_env is changed else 'auto' }}"
  register: app_compose

- name: Wait for the container to report healthy
  ansible.builtin.command:
    cmd: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' shortener
  register: app_health
  until: app_health.stdout == 'healthy'
  retries: 12
  delay: 5
  changed_when: false

# End to end through Caddy: DNS name -> TLS -> reverse proxy -> app.
# -k because the certificate may still be a staging one.
- name: Check the public site reaches the app
  ansible.builtin.command:
    cmd: >-
      curl -sk --max-time 5 --resolve {{ primary_fqdn }}:443:127.0.0.1
      -o /dev/null -w '%{http_code}' https://{{ primary_fqdn }}{{ item }}
  loop:
    - /healthz
    - /readyz
  register: app_probe
  until: app_probe.stdout == '200'
  retries: 6
  delay: 5
  changed_when: false
