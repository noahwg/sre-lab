---
# Read on the machine running Ansible, with your AWS credentials.
- name: Read the Grafana admin password from SSM Parameter Store
  ansible.builtin.set_fact:
    monitoring_grafana_password: "{{ lookup('amazon.aws.ssm_parameter', monitoring_grafana_password_parameter, region=ansible_aws_ssm_region, decrypt=true) }}"
  no_log: true

- name: Refuse a missing or placeholder Grafana password
  ansible.builtin.assert:
    that:
      - monitoring_grafana_password != monitoring_password_placeholder
      - monitoring_grafana_password | length >= monitoring_password_min_length
      - monitoring_grafana_password is match('^[A-Za-z0-9]+$')
    fail_msg: >-
      {{ monitoring_grafana_password_parameter }} is still the placeholder, shorter than
      {{ monitoring_password_min_length }} characters, or not alphanumeric
      (generate with: openssl rand -hex 24).
    quiet: true
  no_log: true

# The volume mounts with `nofail`, so a missing volume would otherwise leave us quietly
# writing metrics onto the root disk.
- name: Check the telemetry volume is mounted
  ansible.builtin.command: mountpoint -q {{ telemetry_mount_point }}
  changed_when: false

- name: Create the monitoring directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "0755"
  loop:
    - { path: "{{ monitoring_dir }}" }
    - { path: "{{ monitoring_dir }}/provisioning" }
    - { path: "{{ monitoring_dir }}/provisioning/datasources" }
    - { path: "{{ monitoring_dir }}/provisioning/dashboards" }
    - { path: "{{ monitoring_dir }}/dashboards" }
    - { path: "{{ monitoring_data_dir }}" }
    - { path: "{{ monitoring_data_dir }}/victoriametrics" }
    - { path: "{{ monitoring_data_dir }}/victorialogs" }
    - { path: "{{ monitoring_data_dir }}/victoriatraces" }
    - { path: "{{ monitoring_data_dir }}/fluent-bit" }
    - { path: "{{ monitoring_dir }}/fluent-bit" }
    - { path: "{{ monitoring_dir }}/victoriametrics" }
    - { path: "{{ monitoring_data_dir }}/grafana", owner: "{{ monitoring_grafana_uid }}" }

- name: Render the scrape config
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: "{{ monitoring_dir }}/victoriametrics/scrape.yml"
    owner: root
    group: root
    mode: "0644"
  notify: reload scrape config

# The scrape config used to live directly in monitoring_dir (mounted as a single file).
- name: Remove the old scrape config location
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/scrape.yml"
    state: absent

- name: Render the Fluent Bit config
  ansible.builtin.template:
    src: "fluent-bit/{{ item }}.j2"
    dest: "{{ monitoring_dir }}/fluent-bit/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - fluent-bit.conf
    - parsers.conf
    - service.lua
  notify: restart fluent bit

# GF_PLUGINS_PREINSTALL can't be used: it adds to Grafana's default app plugins instead of
# replacing them. A one-off `grafana cli` run installs just this plugin, into the data
# directory, and a marker file makes it run once per pinned version.
- name: Install the VictoriaLogs Grafana plugin
  ansible.builtin.shell:
    cmd: >-
      docker run --rm --user {{ monitoring_grafana_uid }} --entrypoint grafana
      -v {{ monitoring_data_dir }}/grafana:/var/lib/grafana {{ monitoring_grafana_image }}
      cli --pluginsDir /var/lib/grafana/plugins plugins install
      victoriametrics-logs-datasource {{ monitoring_victorialogs_plugin_version }}
      && touch {{ monitoring_dir }}/.victorialogs-plugin-{{ monitoring_victorialogs_plugin_version }}
    creates: "{{ monitoring_dir }}/.victorialogs-plugin-{{ monitoring_victorialogs_plugin_version }}"
  notify: restart grafana

- name: Render the Grafana datasources
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ monitoring_dir }}/provisioning/datasources/datasources.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart grafana

- name: Install the dashboard provider
  ansible.builtin.copy:
    src: dashboards.yml
    dest: "{{ monitoring_dir }}/provisioning/dashboards/dashboards.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart grafana

# Grafana re-reads this directory every 30 seconds, so no restart is needed.
# __INSTANCE_ID__ in the CloudWatch queries is replaced with this host's instance ID
# (a wildcard dimension returned no data), so the files are written from content.
- name: Install the dashboards
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', item) | replace('__INSTANCE_ID__', ansible_host) }}"
    dest: "{{ monitoring_dir }}/dashboards/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ lookup('ansible.builtin.fileglob', role_path ~ '/files/dashboards/*.json', wantlist=True) }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Write the Grafana environment file
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "{{ monitoring_dir }}/grafana.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: monitoring_env

- name: Render the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ monitoring_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start the monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present
    remove_orphans: true
    # env_file changes don't alter the compose file, so force a recreate when it changed.
    recreate: "{{ 'always' if monitoring_env is changed else 'auto' }}"
  register: monitoring_compose

# Apply pending config changes (scrape targets, datasources, Fluent Bit config) now, before the
# checks below, which would otherwise run against the old config.
- name: Apply config changes
  ansible.builtin.meta: flush_handlers

- name: Wait for VictoriaMetrics
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_vm_port }}/health"
    return_content: true
  register: monitoring_vm_health
  until: monitoring_vm_health.status == 200
  retries: 12
  delay: 5
  changed_when: false

- name: Wait for VictoriaLogs
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_victorialogs_port }}/health"
  register: monitoring_vl_health
  until: monitoring_vl_health.status == 200
  retries: 12
  delay: 5
  changed_when: false

- name: Wait for VictoriaTraces
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_victoriatraces_port }}/health"
  register: monitoring_vt_health
  until: monitoring_vt_health.status == 200
  retries: 12
  delay: 5
  changed_when: false

- name: Wait for Grafana
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_grafana_port }}/api/health"
  register: monitoring_grafana_health
  until: monitoring_grafana_health.status == 200
  retries: 18
  delay: 5
  changed_when: false

# Every scrape target must be up: this catches a wrong container name, a network that
# isn't shared, or an app that stopped serving /metrics.
- name: Check every scrape target is up
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_vm_port }}/api/v1/query?query=sum(up)"
    return_content: true
  register: monitoring_up
  until: >-
    monitoring_up.json.data.result | length == 1
    and (monitoring_up.json.data.result[0].value[1] | int) == (monitoring_scrape_targets | length)
  retries: 18
  delay: 5
  changed_when: false

# Fluent Bit has had time to ship something: our own containers log constantly (Caddy,
# the app, Postgres), so recent lines for at least one service must exist.
- name: Check logs are arriving in VictoriaLogs
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_victorialogs_port }}/select/logsql/query"
    method: POST
    body_format: form-urlencoded
    body:
      query: "_time:10m | stats by (service) count() as n"
      limit: "20"
    return_content: true
  register: monitoring_logs
  until: monitoring_logs.content | trim | length > 0
  retries: 18
  delay: 5
  changed_when: false

- name: Check Grafana can reach VictoriaMetrics
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_grafana_port }}/api/datasources/uid/victoriametrics/health"
    url_username: admin
    url_password: "{{ monitoring_grafana_password }}"
    force_basic_auth: true
    return_content: true
  register: monitoring_datasource
  failed_when: monitoring_datasource.json.status | default('') != 'OK'
  changed_when: false
  no_log: true

- name: Check Grafana can reach VictoriaLogs
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_grafana_port }}/api/datasources/uid/victorialogs/health"
    url_username: admin
    url_password: "{{ monitoring_grafana_password }}"
    force_basic_auth: true
    return_content: true
  register: monitoring_logs_datasource
  failed_when: monitoring_logs_datasource.json.status | default('') != 'OK'
  changed_when: false
  no_log: true

- name: Check Grafana can reach VictoriaTraces
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_grafana_port }}/api/datasources/uid/victoriatraces/health"
    url_username: admin
    url_password: "{{ monitoring_grafana_password }}"
    force_basic_auth: true
    return_content: true
  register: monitoring_traces_datasource
  failed_when: monitoring_traces_datasource.json.status | default('') != 'OK'
  changed_when: false
  no_log: true
