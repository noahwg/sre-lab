---
app_dir: /opt/shortener
app_image_repository_name: sre-lab
# Required: set in group_vars/all.yml or with -e. Format: shortener-<full commit sha>
# app_image_tag:

# SSM Parameter Store path of the API key (created by the secrets stack). Read
# from the machine running Ansible, using your own AWS credentials.
app_project: sre-lab
app_api_key_parameter: "/{{ app_project }}/shortener/api_key"
app_api_key_min_length: 16
app_api_key_placeholder: REPLACE_ME

app_memory_limit: 64m
app_log_format: json
app_log_level: info

# Traces: the app sends OTLP/HTTP to VictoriaTraces over the shared `edge` network. Set the
# endpoint to "" to turn tracing off. The ratio is the fraction of new traces kept (1.0 = all);
# lower it if traffic grows. VictoriaTraces drops the oldest data past its disk cap either way.
app_otel_endpoint: http://victoriatraces:10428/insert/opentelemetry
app_otel_sample_ratio: 1.0

# Docker network created by the edge role.
app_network: "{{ edge_network | default('edge') }}"

# Database, on the private `db` network (see the postgres role for the names). The app
# connects as the restricted app role; migrations run as the owner role.
app_db_host: postgres
app_db_name: "{{ postgres_db | default('shortener') }}"
app_db_owner_user: "{{ postgres_owner_user | default('shortener_owner') }}"
app_db_network: "{{ postgres_network | default('db') }}"
app_db_owner_password_parameter: "/{{ app_project }}/postgres/owner_password"
app_db_app_user: "{{ postgres_app_user | default('shortener_app') }}"
app_db_app_password_parameter: "/{{ app_project }}/postgres/app_password"
app_migrate_memory_limit: 64m
